name: CI/CD

# PR 에서는 검증 + 이미지 빌드까지만 (레지스트리 push 없음).
# main 에 머지되면 GHCR 로 push 하고 EC2 에 배포한다.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: '배포할 이미지 태그. 비우면 현재 커밋으로 새로 빌드하고, 이전 커밋 SHA 를 넣으면 재빌드 없이 롤백한다.'
        required: false
        type: string

# 같은 브랜치의 배포가 겹치지 않도록 직렬화한다.
# PR 은 새 커밋이 오면 이전 실행을 취소하지만, main 배포 중에는 취소하지 않는다.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io

jobs:
  # ---------------------------------------------------------------------------
  # 1) 검증 — Django 설정 무결성과 마이그레이션 정합성
  # ---------------------------------------------------------------------------
  validate:
    name: Django 검증
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DB_ENGINE: sqlite
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # mysqlclient 는 소스 빌드라 MySQL 개발 헤더가 필요하다.
      - name: 시스템 의존성 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            default-libmysqlclient-dev pkg-config gcc

      - name: 파이썬 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: manage.py check (dev 프로파일)
        env:
          DJANGO_ENV: dev
        run: python manage.py check

      # 모델은 고쳤는데 makemigrations 를 안 돌린 경우를 배포 전에 잡는다.
      - name: 마이그레이션 누락 검사
        env:
          DJANGO_ENV: dev
        run: python manage.py makemigrations --check --dry-run

      # 마이그레이션이 빈 DB 에 실제로 적용되는지 확인한다.
      # (충돌·순환 의존성·깨진 RunPython 을 여기서 걸러낸다)
      - name: 마이그레이션 적용 검사
        env:
          DJANGO_ENV: dev
          DB_SQLITE_PATH: /tmp/ci-check.sqlite3
        run: python manage.py migrate --noinput

      # prod 프로파일로 부팅되는지 + 보안 설정 점검.
      # 경고(W)는 통과시키고 에러(E)만 실패시킨다.
      - name: 배포 설정 검사 (prod 프로파일)
        env:
          DJANGO_ENV: prod
          DJANGO_SECRET_KEY: ci-only-not-a-real-secret
          DJANGO_ALLOWED_HOSTS: example.com
          DJANGO_CSRF_ORIGINS: https://example.com
        run: python manage.py check --deploy --fail-level ERROR

  # ---------------------------------------------------------------------------
  # 2) 빌드 — 3개 이미지(API · Web BFF · Admin BFF) 빌드, main 에서만 GHCR push
  # ---------------------------------------------------------------------------
  build:
    name: 이미지 빌드
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      # GHCR 경로는 소문자만 허용한다 (리포지토리명에 대문자가 섞여 있음).
      # image 는 베이스 이름. web/admin 은 뒤에 -web, -admin 을 붙인다.
      - name: 이미지 이름/태그 결정
        id: meta
        env:
          REQUESTED_TAG: ${{ inputs.image_tag }}
        run: |
          echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=${REQUESTED_TAG:-$GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: GHCR 로그인
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # workflow_dispatch 로 기존 태그를 지정한 롤백이면 재빌드하지 않는다.

      # --- API 이미지 (루트 Dockerfile) ---
      - name: API 이미지 빌드 & 푸시
        if: ${{ !inputs.image_tag }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      # --- Web BFF 이미지 (docker/Dockerfile.web) ---
      - name: Web BFF 이미지 빌드 & 푸시
        if: ${{ !inputs.image_tag }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.web
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.meta.outputs.image }}-web:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # --- Admin BFF 이미지 (docker/Dockerfile.admin) ---
      - name: Admin BFF 이미지 빌드 & 푸시
        if: ${{ !inputs.image_tag }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.admin
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.meta.outputs.image }}-admin:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}-admin:latest
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin

  # ---------------------------------------------------------------------------
  # 3) 배포 — EIC Endpoint 를 통해 EC2 에 접속해 새 이미지로 교체
  # ---------------------------------------------------------------------------
  deploy:
    name: EC2 배포 (EIC)
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Settings > Environments > production 에서 수동 승인 게이트를 걸 수 있다.
    environment:
      name: production
      url: https://hackmin.com/api/v1/health
    permissions:
      contents: read
      packages: read
      id-token: write          # OIDC 토큰 발급에 필요
    env:
      IMAGE: ${{ needs.build.outputs.image }}
      TAG: ${{ needs.build.outputs.tag }}
      APP_DIR: ${{ vars.APP_DIR || '/opt/hackmin' }}
      STAGE_DIR: /tmp/hackmin-deploy
      SSH_USER: ${{ vars.EC2_USER || 'ec2-user' }}
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      AWS_REGION: ap-northeast-2
    steps:
      - uses: actions/checkout@v4

      # OIDC 로 AWS 자격증명을 받는다 (액세스 키 불필요).
      - name: AWS 자격증명 설정 (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 필수 설정값 확인
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
        run: |
          fail=0
          [ -n "$INSTANCE_ID" ]          || { echo "::error::리포지토리 변수 EC2_INSTANCE_ID 미설정"; fail=1; }
          [ -n "$DJANGO_SECRET_KEY" ]    || { echo "::error::시크릿 DJANGO_SECRET_KEY 미설정"; fail=1; }
          exit $fail

      # EIC 는 임시 SSH 키를 사용한다 — 고정 키(EC2_SSH_KEY) 불필요.
      # send-ssh-public-key 로 push 한 키는 60초간만 유효하므로,
      # 각 SSH/SCP 호출 직전에 매번 push 해야 한다.
      - name: SSH 키 생성
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keygen -t ed25519 -f ~/.ssh/id_deploy -N "" -q

      # EIC Endpoint 를 SSH ProxyCommand 로 사용하는 헬퍼 스크립트.
      # 매 SSH/SCP 호출마다 임시 키를 다시 push 한 뒤 ProxyCommand 로 터널링한다.
      - name: SSH 헬퍼 생성
        run: |
          cat > /tmp/eic-ssh.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -e
          # 임시 키를 다시 push (60초 유효)
          aws ec2-instance-connect send-ssh-public-key \
            --instance-id "$INSTANCE_ID" \
            --instance-os-user "$SSH_USER" \
            --ssh-public-key file://~/.ssh/id_deploy.pub \
            --region "$AWS_REGION" > /dev/null

          PROXY="aws ec2-instance-connect open-tunnel --instance-id $INSTANCE_ID --remote-port 22 --region $AWS_REGION"

          if [ "$1" = "scp" ]; then
            shift
            scp -i ~/.ssh/id_deploy \
              -o ProxyCommand="$PROXY" \
              -o StrictHostKeyChecking=no \
              "$@"
          else
            ssh -i ~/.ssh/id_deploy \
              -o ProxyCommand="$PROXY" \
              -o StrictHostKeyChecking=no \
              "$SSH_USER@$INSTANCE_ID" "$@"
          fi
          SCRIPT
          chmod +x /tmp/eic-ssh.sh

      # 시크릿을 SSH 커맨드라인 인자로 넘기면 원격 ps 에 노출되고,
      # 특수문자가 든 값은 인용이 깨진다. 파일로 만들어 scp 로 전송한다.
      - name: 배포용 .env 생성
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          DJANGO_ENV: ${{ vars.DJANGO_ENV || 'dev' }}
          DJANGO_DEBUG: ${{ vars.DJANGO_DEBUG || '1' }}
          DJANGO_ALLOWED_HOSTS: ${{ vars.DJANGO_ALLOWED_HOSTS }}
          DJANGO_CSRF_ORIGINS: ${{ vars.DJANGO_CSRF_ORIGINS }}
          DJANGO_CORS_ORIGINS: ${{ vars.DJANGO_CORS_ORIGINS }}
          DJANGO_SSL_REDIRECT: ${{ vars.DJANGO_SSL_REDIRECT || '0' }}
          DB_ENGINE: ${{ vars.DB_ENGINE || 'sqlite' }}
          DB_NAME: ${{ vars.DB_NAME || 'hackmin' }}
          DB_USER: ${{ vars.DB_USER || 'hackmin' }}
          DB_HOST: ${{ vars.DB_HOST }}
          DB_PORT: ${{ vars.DB_PORT || '3306' }}
          USE_S3: ${{ vars.USE_S3 || '0' }}
          AWS_S3_BUCKET_NAME: ${{ vars.AWS_S3_BUCKET_NAME || 'hackmin-media-bucket' }}
          AWS_S3_REGION_NAME: ${{ vars.AWS_S3_REGION_NAME || 'ap-northeast-2' }}
          SEED_DEMO: ${{ vars.SEED_DEMO || '0' }}
          ADMIN_BIND: ${{ vars.ADMIN_BIND || '127.0.0.1' }}
        run: |
          umask 077
          mkdir -p stage

          APP_KEYS="DJANGO_ENV DJANGO_DEBUG DJANGO_SECRET_KEY
                    DJANGO_ALLOWED_HOSTS DJANGO_CSRF_ORIGINS DJANGO_CORS_ORIGINS
                    DJANGO_SSL_REDIRECT DB_ENGINE DB_NAME DB_USER DB_PASSWORD
                    DB_HOST DB_PORT USE_S3 AWS_S3_BUCKET_NAME AWS_S3_REGION_NAME
                    AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY OPENAI_API_KEY
                    SEED_DEMO"

          # docker compose 의 env_file 파서는 따옴표 없는 값에서 줄바꿈을 만나면
          # 형식이 깨지고, 공백 뒤의 #부터는 주석으로 잘라낸다. 조용히 잘린 채
          # 배포되면 디버깅이 매우 어려우므로 여기서 먼저 막는다.
          bad=0
          for k in $APP_KEYS; do
            v="${!k}"
            case "$v" in
              *$'\n'*|*$'\r'*)
                echo "::error::$k 값에 줄바꿈이 있습니다. GitHub Secrets/Variables 를 확인하세요."; bad=1 ;;
              *' #'*)
                echo "::error::$k 값에 '공백+#' 이 있습니다. env_file 파서가 주석으로 잘라냅니다."; bad=1 ;;
            esac
          done
          [ "$bad" -eq 0 ] || exit 1

          # app.env — 컨테이너로 그대로 전달되는 값. 보간을 거치지 않으므로
          # $ 나 특수문자가 든 시크릿도 안전하다.
          for k in $APP_KEYS; do
            printf '%s=%s\n' "$k" "${!k}"
          done > stage/app.env

          # .env — compose 파일의 ${...} 치환에만 쓴다. 시크릿을 넣지 않는다.
          # 3개 이미지 변수: API / Web BFF / Admin BFF
          cat > stage/compose.env <<EOF
          HACKMIN_IMAGE=$IMAGE:$TAG
          HACKMIN_WEB_IMAGE=$IMAGE-web:$TAG
          HACKMIN_ADMIN_IMAGE=$IMAGE-admin:$TAG
          ADMIN_BIND=$ADMIN_BIND
          EOF
          # heredoc 들여쓰기 제거
          sed -i 's/^[[:space:]]*//' stage/compose.env

          expected=$(echo $APP_KEYS | wc -w)
          actual=$(wc -l < stage/app.env)
          if [ "$actual" -ne "$expected" ]; then
            echo "::error::app.env 라인 수 불일치 (기대 $expected, 실제 $actual)"
            exit 1
          fi
          echo "app.env $actual개 항목 생성 완료"
          echo "compose.env:"
          cat stage/compose.env

      - name: 배포 파일 전송
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          umask 077
          cp docker-compose.prod.yml scripts/deploy_remote.sh stage/
          printf '%s' "$GHCR_TOKEN" > stage/ghcr.token

          /tmp/eic-ssh.sh \
            "rm -rf '$STAGE_DIR' && mkdir -p '$STAGE_DIR' && chmod 700 '$STAGE_DIR'"

          /tmp/eic-ssh.sh scp -q \
            stage/app.env stage/compose.env stage/docker-compose.prod.yml \
            stage/deploy_remote.sh stage/ghcr.token \
            "$SSH_USER@$INSTANCE_ID:$STAGE_DIR/"

      - name: 배포 실행
        run: |
          /tmp/eic-ssh.sh \
            "APP_DIR='$APP_DIR' STAGE_DIR='$STAGE_DIR' GHCR_USER='${{ github.actor }}' \
             bash '$STAGE_DIR/deploy_remote.sh'"

      - name: 헬스체크 (서버 내부)
        run: |
          /tmp/eic-ssh.sh bash -s <<'EOF'
          set -e
          for port in 8000 8001 8002; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 \
                     -H "Host: hackmin.com" \
                     "http://127.0.0.1:$port/api/v1/health" || echo 000)
            # web/admin-web 은 URLConf 가 달라 health 가 404 인 게 정상이다.
            # 컨테이너가 죽어 있으면 000(연결 실패)이 나온다.
            case "$port:$code" in
              8000:200|8001:404|8002:404) echo "  포트 $port → $code (정상)" ;;
              *) echo "  포트 $port → $code (비정상)"; exit 1 ;;
            esac
          done
          echo "전체 서비스 정상"
          EOF

      - name: 배포 실패 시 로그 수집
        if: failure()
        run: |
          /tmp/eic-ssh.sh \
            "cd '$APP_DIR' 2>/dev/null && docker compose -f docker-compose.prod.yml logs --tail=100 || true" \
            || true

      - name: 자격증명 정리
        if: always()
        run: |
          rm -rf ~/.ssh/id_deploy ~/.ssh/id_deploy.pub stage /tmp/eic-ssh.sh