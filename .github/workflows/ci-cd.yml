name: CI/CD

# PR 에서는 검증 + 이미지 빌드까지만 (레지스트리 push 없음).
# main 에 머지되면 GHCR 로 push 하고 EC2 에 배포한다.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: '배포할 이미지 태그. 비우면 현재 커밋으로 새로 빌드하고, 이전 커밋 SHA 를 넣으면 재빌드 없이 롤백한다.'
        required: false
        type: string

# 같은 브랜치의 배포가 겹치지 않도록 직렬화한다.
# PR 은 새 커밋이 오면 이전 실행을 취소하지만, main 배포 중에는 취소하지 않는다.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io

jobs:
  # ---------------------------------------------------------------------------
  # 1) 검증 — Django 설정 무결성과 마이그레이션 정합성
  # ---------------------------------------------------------------------------
  validate:
    name: Django 검증
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DB_ENGINE: sqlite
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # mysqlclient 는 소스 빌드라 MySQL 개발 헤더가 필요하다.
      - name: 시스템 의존성 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            default-libmysqlclient-dev pkg-config gcc

      - name: 파이썬 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: manage.py check (dev 프로파일)
        env:
          DJANGO_ENV: dev
        run: python manage.py check

      # 모델은 고쳤는데 makemigrations 를 안 돌린 경우를 배포 전에 잡는다.
      - name: 마이그레이션 누락 검사
        env:
          DJANGO_ENV: dev
        run: python manage.py makemigrations --check --dry-run

      # 마이그레이션이 빈 DB 에 실제로 적용되는지 확인한다.
      # (충돌·순환 의존성·깨진 RunPython 을 여기서 걸러낸다)
      - name: 마이그레이션 적용 검사
        env:
          DJANGO_ENV: dev
          DB_SQLITE_PATH: /tmp/ci-check.sqlite3
        run: python manage.py migrate --noinput

      # prod 프로파일로 부팅되는지 + 보안 설정 점검.
      # 경고(W)는 통과시키고 에러(E)만 실패시킨다.
      - name: 배포 설정 검사 (prod 프로파일)
        env:
          DJANGO_ENV: prod
          DJANGO_SECRET_KEY: ci-only-not-a-real-secret
          DJANGO_ALLOWED_HOSTS: example.com
          DJANGO_CSRF_ORIGINS: https://example.com
        run: python manage.py check --deploy --fail-level ERROR

  # ---------------------------------------------------------------------------
  # 2) 검증 — 점주 웹(web_bff) 이미지
  #
  # web_bff 는 DB에 접속하지 않고 의존성도 다르다(Django/httpx/redis 뿐).
  # api 검증과 섞으면 requirements.txt 가 함께 설치돼 "DB 없이도 뜨는지"를
  # 확인하지 못하므로 별도 job 으로 둔다.
  # ---------------------------------------------------------------------------
  validate-web:
    name: 점주 웹 검증
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 의존성 설치 (web 전용)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-web.txt

      # DATABASES = {} 인 상태로 정상 부팅되는지 확인한다.
      # ORM 을 실수로 호출하는 코드가 들어가면 여기서 걸린다.
      - name: manage_web.py check
        env:
          DJANGO_SECRET_KEY: ci-only-not-a-real-secret
          DJANGO_ALLOWED_HOSTS: example.com
          REDIS_URL: redis://localhost:6379/0
        run: python manage_web.py check

  # ---------------------------------------------------------------------------
  # 3) 빌드 — 이미지 2개. main 에서만 GHCR 로 push
  #
  #   <repo>       : api / admin-web 용 (루트 Dockerfile)
  #   <repo>-web   : 점주 웹 용 (docker/Dockerfile.web)
  # ---------------------------------------------------------------------------
  build:
    name: 이미지 빌드
    needs: [validate, validate-web]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      web_image: ${{ steps.meta.outputs.web_image }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      # GHCR 경로는 소문자만 허용한다 (리포지토리명에 대문자가 섞여 있음).
      - name: 이미지 이름/태그 결정
        id: meta
        env:
          REQUESTED_TAG: ${{ inputs.image_tag }}
        run: |
          echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "web_image=${REGISTRY}/${GITHUB_REPOSITORY,,}-web" >> "$GITHUB_OUTPUT"
          echo "tag=${REQUESTED_TAG:-$GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: GHCR 로그인
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # workflow_dispatch 로 기존 태그를 지정한 롤백이면 재빌드하지 않는다.
      - name: 빌드 & 푸시 (api)
        if: ${{ !inputs.image_tag }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: 빌드 & 푸시 (점주 웹)
        if: ${{ !inputs.image_tag }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile.web
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.meta.outputs.web_image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.web_image }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # ---------------------------------------------------------------------------
  # 4) 배포 — EC2 에 SSH 접속해 새 이미지로 교체
  #
  # 리포지토리 변수 DEPLOY_ENABLED=true 일 때만 실행된다. 변수가 없으면 job 이
  # '실패'가 아니라 'skipped' 로 지나가므로, 개발 중 푸시마다 빨간 X 가 뜨지 않는다.
  #
  # 켜는 법: Settings > Secrets and variables > Actions 에서 아래를 먼저 등록한 뒤
  #          맨 마지막에 DEPLOY_ENABLED 를 추가한다.
  #   Variables: EC2_HOST, EC2_USER, DJANGO_ALLOWED_HOSTS, DJANGO_CSRF_ORIGINS,
  #              WEB_BFF_CSRF_ORIGINS, DB_ENGINE, DB_HOST, DB_SSL_CA ...
  #   Secrets  : EC2_SSH_KEY, EC2_KNOWN_HOSTS, DJANGO_SECRET_KEY,
  #              WEB_BFF_SECRET_KEY, DB_PASSWORD ...
  # ---------------------------------------------------------------------------
  deploy:
    name: EC2 배포
    needs: build
    if: ${{ github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Settings > Environments > production 에서 수동 승인 게이트를 걸 수 있다.
    environment:
      name: production
      url: http://${{ vars.EC2_HOST }}/api/v1/health
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ${{ needs.build.outputs.image }}
      WEB_IMAGE: ${{ needs.build.outputs.web_image }}
      TAG: ${{ needs.build.outputs.tag }}
      APP_DIR: ${{ vars.APP_DIR || '/opt/hackmin' }}
      STAGE_DIR: /tmp/hackmin-deploy
      SSH_USER: ${{ vars.EC2_USER || 'deploy' }}
      SSH_HOST: ${{ vars.EC2_HOST }}
      SSH_PORT: ${{ vars.EC2_PORT || '22' }}
    steps:
      - uses: actions/checkout@v4

      - name: 필수 설정값 확인
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          WEB_BFF_SECRET_KEY: ${{ secrets.WEB_BFF_SECRET_KEY }}
        run: |
          fail=0
          [ -n "$SSH_HOST" ]              || { echo "::error::리포지토리 변수 EC2_HOST 미설정"; fail=1; }
          [ -n "$SSH_KEY" ]               || { echo "::error::시크릿 EC2_SSH_KEY 미설정"; fail=1; }
          [ -n "$DJANGO_SECRET_KEY" ]     || { echo "::error::시크릿 DJANGO_SECRET_KEY 미설정"; fail=1; }
          [ -n "$WEB_BFF_SECRET_KEY" ]    || { echo "::error::시크릿 WEB_BFF_SECRET_KEY 미설정 (점주 웹 세션 서명용)"; fail=1; }
          exit $fail

      - name: SSH 준비
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "$KNOWN_HOSTS" ]; then
            # 호스트 키를 고정해 두면 중간자 공격을 막을 수 있다 (권장).
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::EC2_KNOWN_HOSTS 미설정 — 호스트 키를 검증 없이 수집합니다. 'ssh-keyscan -H <EC2_IP>' 출력을 해당 시크릿에 등록하면 중간자 공격을 막을 수 있습니다."
            ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      # 시크릿을 SSH 커맨드라인 인자로 넘기면 원격 ps 에 노출되고,
      # 특수문자가 든 값은 인용이 깨진다. 파일로 만들어 scp 로 전송한다.
      - name: 배포용 .env 생성
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          DJANGO_ENV: ${{ vars.DJANGO_ENV || 'dev' }}
          DJANGO_DEBUG: ${{ vars.DJANGO_DEBUG || '1' }}
          DJANGO_ALLOWED_HOSTS: ${{ vars.DJANGO_ALLOWED_HOSTS }}
          DJANGO_CSRF_ORIGINS: ${{ vars.DJANGO_CSRF_ORIGINS }}
          DJANGO_CORS_ORIGINS: ${{ vars.DJANGO_CORS_ORIGINS }}
          DJANGO_SSL_REDIRECT: ${{ vars.DJANGO_SSL_REDIRECT || '0' }}
          DB_ENGINE: ${{ vars.DB_ENGINE || 'sqlite' }}
          DB_NAME: ${{ vars.DB_NAME || 'hackmin' }}
          DB_USER: ${{ vars.DB_USER || 'hackmin' }}
          DB_HOST: ${{ vars.DB_HOST }}
          DB_PORT: ${{ vars.DB_PORT || '3306' }}
          # RDS 강제 SSL 을 쓰면 컨테이너 안 경로를 넣는다: /app/certs/rds-ca.pem
          DB_SSL_CA: ${{ vars.DB_SSL_CA }}
          USE_S3: ${{ vars.USE_S3 || '0' }}
          AWS_S3_BUCKET_NAME: ${{ vars.AWS_S3_BUCKET_NAME || 'hackmin-media-bucket' }}
          AWS_S3_REGION_NAME: ${{ vars.AWS_S3_REGION_NAME || 'ap-northeast-2' }}
          SEED_DEMO: ${{ vars.SEED_DEMO || '0' }}
          ADMIN_BIND: ${{ vars.ADMIN_BIND || '127.0.0.1' }}
          # --- 점주 웹(web_bff) 전용 ---
          # api 와 다른 키를 쓴다. 세션 쿠키 서명 전용.
          WEB_BFF_SECRET_KEY: ${{ secrets.WEB_BFF_SECRET_KEY }}
          # 스킴까지 정확히 맞아야 한다. HTTPS 를 쓰면 https:// 를 반드시 포함할 것.
          WEB_BFF_CSRF_ORIGINS: ${{ vars.WEB_BFF_CSRF_ORIGINS }}
          WEB_BFF_ALLOWED_HOSTS: ${{ vars.WEB_BFF_ALLOWED_HOSTS || '*' }}
          # nginx 등 프록시가 X-Forwarded-Proto 를 붙여줄 때만 1.
          USE_X_FORWARDED_PROTO: ${{ vars.USE_X_FORWARDED_PROTO || '0' }}
        run: |
          umask 077
          mkdir -p stage

          APP_KEYS="DJANGO_ENV DJANGO_DEBUG DJANGO_SECRET_KEY
                    DJANGO_ALLOWED_HOSTS DJANGO_CSRF_ORIGINS DJANGO_CORS_ORIGINS
                    DJANGO_SSL_REDIRECT DB_ENGINE DB_NAME DB_USER DB_PASSWORD
                    DB_HOST DB_PORT DB_SSL_CA USE_S3 AWS_S3_BUCKET_NAME
                    AWS_S3_REGION_NAME
                    OPENAI_API_KEY SEED_DEMO
                    WEB_BFF_SECRET_KEY WEB_BFF_CSRF_ORIGINS WEB_BFF_ALLOWED_HOSTS
                    USE_X_FORWARDED_PROTO"

          # docker compose 의 env_file 파서는 따옴표 없는 값에서 줄바꿈을 만나면
          # 형식이 깨지고, 공백 뒤의 #부터는 주석으로 잘라낸다. 조용히 잘린 채
          # 배포되면 디버깅이 매우 어려우므로 여기서 먼저 막는다.
          bad=0
          for k in $APP_KEYS; do
            v="${!k}"
            case "$v" in
              *$'\n'*|*$'\r'*)
                echo "::error::$k 값에 줄바꿈이 있습니다. GitHub Secrets/Variables 를 확인하세요."; bad=1 ;;
              *' #'*)
                echo "::error::$k 값에 '공백+#' 이 있습니다. env_file 파서가 주석으로 잘라냅니다."; bad=1 ;;
            esac
          done
          [ "$bad" -eq 0 ] || exit 1

          # app.env — 컨테이너로 그대로 전달되는 값. 보간을 거치지 않으므로
          # $ 나 특수문자가 든 시크릿도 안전하다.
          for k in $APP_KEYS; do
            printf '%s=%s\n' "$k" "${!k}"
          done > stage/app.env

          # .env — compose 파일의 ${...} 치환에만 쓴다. 시크릿을 넣지 않는다.
          printf 'HACKMIN_IMAGE=%s\nHACKMIN_WEB_IMAGE=%s\nADMIN_BIND=%s\n' \
            "$IMAGE:$TAG" "$WEB_IMAGE:$TAG" "$ADMIN_BIND" > stage/compose.env

          expected=$(echo $APP_KEYS | wc -w)
          actual=$(wc -l < stage/app.env)
          if [ "$actual" -ne "$expected" ]; then
            echo "::error::app.env 라인 수 불일치 (기대 $expected, 실제 $actual)"
            exit 1
          fi
          echo "app.env $actual개 항목 생성 완료"

      - name: 배포 파일 전송
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          umask 077
          cp docker-compose.prod.yml scripts/deploy_remote.sh stage/
          printf '%s' "$GHCR_TOKEN" > stage/ghcr.token
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "rm -rf '$STAGE_DIR' && mkdir -p '$STAGE_DIR' && chmod 700 '$STAGE_DIR'"
          scp -i ~/.ssh/id_deploy -P "$SSH_PORT" -q \
            stage/app.env stage/compose.env stage/docker-compose.prod.yml \
            stage/deploy_remote.sh stage/ghcr.token \
            "$SSH_USER@$SSH_HOST:$STAGE_DIR/"

      - name: 배포 실행
        run: |
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "APP_DIR='$APP_DIR' STAGE_DIR='$STAGE_DIR' GHCR_USER='${{ github.actor }}' \
             bash '$STAGE_DIR/deploy_remote.sh'"

      - name: 헬스체크 (서버 내부)
        run: |
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" bash -s <<'EOF'
          set -e
          for port in 8000 8001 8002; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 \
                     "http://127.0.0.1:$port/api/v1/health" || echo 000)
            # web(8001)/admin-web(8002) 는 이 경로를 서비스하지 않아 404 가 정상이다.
            # 컨테이너가 죽어 있으면 000(연결 실패)이 나온다.
            case "$port:$code" in
              8000:200|8001:404|8002:404) echo "  포트 $port → $code (정상)" ;;
              *) echo "  포트 $port → $code (비정상)"; exit 1 ;;
            esac
          done
          # 점주 웹은 전용 헬스 경로로 따로 확인한다.
          web=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 \
                  "http://127.0.0.1:8001/web/health" || echo 000)
          [ "$web" = "200" ] || { echo "  점주 웹 /web/health → $web (비정상)"; exit 1; }
          echo "  점주 웹 /web/health → 200 (정상)"
          echo "전체 서비스 정상"
          EOF

      - name: 배포 실패 시 로그 수집
        if: failure()
        run: |
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "cd '$APP_DIR' 2>/dev/null && docker compose -f docker-compose.prod.yml logs --tail=100 || true"

      - name: 자격증명 정리
        if: always()
        run: |
          rm -rf ~/.ssh/id_deploy stage