# ===========================================================================
# 로컬 개발 + (CI/CD 도입 전) EC2 수동 배포용 compose.
#
# 소스 바인드 마운트(`.:/app`)를 제거했다. 이 마운트는 이미지의 /app 을 호스트
# 폴더로 통째로 덮어쓰기 때문에, Dockerfile 과 .dockerignore 를 아무리 잘
# 정리해도 호스트의 Dockerfile / docker-compose.yml / docker/ / .env / *.pem /
# db.sqlite3 가 그대로 컨테이너 /app 에 나타난다. (파일 읽기·RCE 취약점 하나로
# 인프라 구성과 시크릿이 함께 털린다) 다시 추가하지 말 것.
#
# 대신 코드는 이미지에 구운 것만 쓴다. 따라서 소스를 고쳤으면 반드시 재빌드한다:
#
#   docker compose up -d --build          # 전체
#   docker compose up -d --build api      # 특정 서비스만
#
# 마이그레이션은 api 컨테이너만 수행한다(RUN_MIGRATIONS=1). api 가 먼저 뜨도록
# depends_on 이 걸려 있다.
#
# CI/CD 를 붙인 뒤에는 운영은 docker-compose.prod.yml + scripts/deploy_remote.sh
# 로 옮긴다 (GHCR 이미지 pull, app.env 로 시크릿 분리).
# ===========================================================================
services:
  # ---------------------------------------------------------------------------
  # API 서버 (/api/v1). 스키마 마이그레이션과 데모 시드를 담당한다.
  # ---------------------------------------------------------------------------
  api:
    build: .
    image: hackmin-app
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    # 소스 바인드마운트(.:/app) 금지. 파일 이름을 지정한 볼륨만 붙인다.
    volumes:
      - db_data:/data          # SQLite 공유 볼륨 (web 과 동일 DB 파일)
      - media_data:/app/media  # 사용자 업로드 파일 (USE_S3=1 이면 미사용)
      # RDS 강제 SSL 용 CA 번들. 프로젝트 최상위(= 이 파일과 같은 폴더)의
      # global-bundle.pem 을 읽기 전용으로 붙인다.
      #
      # 예전에는 `.:/app` 바인드마운트 덕에 그냥 보였지만, 마운트를 없앤 지금은
      # 명시적으로 붙여야 한다. 이미지에는 굽지 않는다(.dockerignore 가 *.pem 제외).
      # .env 에 DB_SSL_CA=/app/certs/rds-ca.pem 을 함께 설정할 것.
      #
      # 주의: 이 파일이 없으면 도커가 같은 이름의 빈 디렉터리를 만들어 버린다.
      # 파일이 없는 환경(로컬 sqlite 개발 등)에서는 .env 에 RDS_CA_PATH 로
      # 존재하는 다른 파일 경로를 지정하거나, AWS 공개 번들을 내려받아 두면 된다.
      #   curl -o global-bundle.pem https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem
      - ${RDS_CA_PATH:-./global-bundle.pem}:/app/certs/rds-ca.pem:ro
    security_opt:
      - no-new-privileges:true
    ports:
      - "8000:8000"
    environment:
      # DB_ENGINE=sqlite 이면 공유 볼륨의 파일 DB, mysql 이면 RDS 사용.
      DB_ENGINE: ${DB_ENGINE:-sqlite}
      DB_SQLITE_PATH: /data/db.sqlite3
      DB_NAME: ${DB_NAME:-hackmin}
      DB_USER: ${DB_USER:-hackmin}
      DB_PASSWORD: ${DB_PASSWORD:-hackmin}
      DB_HOST: ${DB_HOST:-}
      DB_PORT: ${DB_PORT:-3306}
      DB_SSL_CA: ${DB_SSL_CA:-}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-dev-key}
      # CSRF/SSL
      DJANGO_CSRF_ORIGINS: "https://54.116.95.188,http://54.116.95.188"
      DJANGO_SSL_REDIRECT: "0"
      # S3 파일 스토리지
      USE_S3: ${USE_S3:-0}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-hackmin-media-bucket}
      AWS_S3_REGION_NAME: ${AWS_S3_REGION_NAME:-ap-northeast-2}
      # 챗봇 (OpenRouter → GPT-4o-mini)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # 이 컨테이너는 /api/v1/ 만 응답한다 (/web/, /admin-web/, /admin/ 은 404).
      DJANGO_ROOT_URLCONF: config.urls_api
      # 이 컨테이너만 migrate/seed 를 실행한다.
      RUN_MIGRATIONS: "1"
      SEED_DEMO: ${SEED_DEMO:-1}

  # ---------------------------------------------------------------------------
  # 점주(owner) 웹 (/web). 같은 이미지·같은 DB 를 공유하며, DB 스키마가
  # 준비될 때까지 대기했다가 기동한다. 관리자 화면은 admin-web 서비스로 분리됨.
  # ---------------------------------------------------------------------------
  web:
    build: .
    image: hackmin-app
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    depends_on:
      - api
    volumes:
      - db_data:/data
      - media_data:/app/media
      # api 와 동일한 CA 번들 (프로젝트 최상위의 global-bundle.pem)
      - ${RDS_CA_PATH:-./global-bundle.pem}:/app/certs/rds-ca.pem:ro
    security_opt:
      - no-new-privileges:true
    ports:
      - "8001:8000"
    environment:
      DB_ENGINE: ${DB_ENGINE:-sqlite}
      DB_SQLITE_PATH: /data/db.sqlite3
      DB_NAME: ${DB_NAME:-hackmin}
      DB_USER: ${DB_USER:-hackmin}
      DB_PASSWORD: ${DB_PASSWORD:-hackmin}
      DB_HOST: ${DB_HOST:-}
      DB_PORT: ${DB_PORT:-3306}
      DB_SSL_CA: ${DB_SSL_CA:-}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-dev-key}
      # CSRF/SSL
      DJANGO_CSRF_ORIGINS: "https://54.116.95.188,http://54.116.95.188"
      DJANGO_SSL_REDIRECT: "0"
      # S3 파일 스토리지
      USE_S3: ${USE_S3:-0}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-hackmin-media-bucket}
      AWS_S3_REGION_NAME: ${AWS_S3_REGION_NAME:-ap-northeast-2}
      # 이 컨테이너는 /web/ 만 응답한다 (/api/v1/, /admin-web/, /admin/ 은 404).
      DJANGO_ROOT_URLCONF: config.urls_web
      # web 은 마이그레이션/시드를 하지 않고 api 가 만든 스키마를 기다린다.
      RUN_MIGRATIONS: "0"
      SEED_DEMO: "0"

  # ---------------------------------------------------------------------------
  # 관리자 웹 (/admin-web/, Django 기본 /admin/). 로컬 개발 시에는 localhost로
  # 바로 확인 가능하도록 모든 인터페이스에 바인딩하지만, EC2에서는 반드시
  # "127.0.0.1:8002:8000" 로 바꿔서 외부에서 직접 접근 불가능하게 하고,
  # nginx가 /admin-web/ location에서 IP 제한을 건 뒤 localhost:8002로만 proxy_pass한다.
  # ---------------------------------------------------------------------------
  admin-web:
    build: .
    image: hackmin-app
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    depends_on:
      - api
    volumes:
      - db_data:/data
      - media_data:/app/media
      # api 와 동일한 CA 번들 (프로젝트 최상위의 global-bundle.pem)
      - ${RDS_CA_PATH:-./global-bundle.pem}:/app/certs/rds-ca.pem:ro
    security_opt:
      - no-new-privileges:true
    ports:
      # 로컬은 0.0.0.0, EC2 는 127.0.0.1 만 열도록 .env 의 ADMIN_BIND 로 제어한다.
      # (EC2 에서는 nginx 가 /admin-web/ 에 IP 제한을 건 뒤 localhost:8002 로 프록시)
      - "${ADMIN_BIND:-0.0.0.0}:8002:8000"
    environment:
      DB_ENGINE: ${DB_ENGINE:-sqlite}
      DB_SQLITE_PATH: /data/db.sqlite3
      DB_NAME: ${DB_NAME:-hackmin}
      DB_USER: ${DB_USER:-hackmin}
      DB_PASSWORD: ${DB_PASSWORD:-hackmin}
      DB_HOST: ${DB_HOST:-}
      DB_PORT: ${DB_PORT:-3306}
      DB_SSL_CA: ${DB_SSL_CA:-}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-dev-key}
      # CSRF/SSL
      DJANGO_CSRF_ORIGINS: "https://54.116.95.188,http://54.116.95.188"
      DJANGO_SSL_REDIRECT: "0"
      USE_S3: ${USE_S3:-0}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-hackmin-media-bucket}
      AWS_S3_REGION_NAME: ${AWS_S3_REGION_NAME:-ap-northeast-2}
      # 이 컨테이너는 /admin-web/, /admin/ 만 응답한다 (나머지는 404).
      DJANGO_ROOT_URLCONF: config.urls_admin
      RUN_MIGRATIONS: "0"
      SEED_DEMO: "0"

  # ---------------------------------------------------------------------------
  # [3-tier PoC] 점주 웹 BFF (docker/Dockerfile.web).
  #
  # 위의 web(8001) 과 같은 화면을 보여주지만 구현이 다르다:
  #   - 이미지에 apps/ config/ 가 없다. DB 드라이버조차 없다.
  #   - 데이터는 전부 api 컨테이너의 /api/v1 HTTP 호출로 가져온다.
  #   - 세션(JWT 보관)은 redis 에 둔다. django_session 테이블을 쓰면 DB 의존이
  #     되살아나기 때문이다.
  #
  # 기존 web 과 나란히 띄워 8001 vs 8003 으로 비교 검증한다.
  # PoC 가 끝나면 web 서비스를 이쪽으로 교체한다.
  # ---------------------------------------------------------------------------
  web-bff:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    image: hackmin-web-bff
    restart: unless-stopped
    depends_on:
      - api
      - redis
    security_opt:
      - no-new-privileges:true
    ports:
      - "8003:8000"
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      # API 컨테이너와 다른 키를 쓴다. 세션 쿠키 서명 전용.
      DJANGO_SECRET_KEY: ${WEB_BFF_SECRET_KEY:-django-insecure-web-bff-dev-key}
      DJANGO_ALLOWED_HOSTS: ${WEB_BFF_ALLOWED_HOSTS:-*}
      # EC2 에서 테스트할 때는 .env 에 실제 접속 주소를 넣는다.
      #   WEB_BFF_CSRF_ORIGINS=http://54.116.95.188:8003
      DJANGO_CSRF_ORIGINS: ${WEB_BFF_CSRF_ORIGINS:-http://localhost:8003,http://127.0.0.1:8003}
      HACKMIN_API_BASE: http://api:8000/api/v1
      REDIS_URL: redis://redis:6379/0

  # ---------------------------------------------------------------------------
  # web-bff 세션 저장소. 외부로 포트를 열지 않는다 (컨테이너 네트워크 전용).
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # 세션만 담으므로 디스크 영속화가 필요 없다.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    security_opt:
      - no-new-privileges:true

volumes:
  db_data:
  media_data:
