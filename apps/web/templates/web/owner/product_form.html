{% extends 'web/base.html' %}
{% block title %}{% if menu %}상품 수정{% else %}상품 등록{% endif %}{% endblock %}
{% block heading %}{% if menu %}상품 수정{% else %}상품 등록{% endif %}{% endblock %}
{% block content %}
<a href="{% url 'web:owner_products' %}" class="muted">← 상품 목록</a>

<div class="panel" style="margin-top:14px;max-width:640px">
  <form method="post" enctype="multipart/form-data">{% csrf_token %}
    <div class="field">
      <label>매장</label>
      <select name="restaurant" required>
        {% for r in restaurants %}
          <option value="{{ r.pk }}" {% if menu and menu.restaurant_id == r.pk %}selected{% endif %}>{{ r.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="field">
      <label>카테고리 (선택)</label>
      <select name="category">
        <option value="">— 없음 —</option>
        {% for c in categories %}
          <option value="{{ c.pk }}" {% if menu and menu.category_id == c.pk %}selected{% endif %}>{{ c.restaurant.name }} · {{ c.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="field">
      <label>상품명</label>
      <input name="name" value="{{ menu.name|default:'' }}" required>
    </div>
    <div class="row">
      <div class="field" style="flex:1">
        <label>가격(원)</label>
        <input type="number" name="price" min="0" max="10000000" value="{{ menu.price|default:0 }}">
      </div>
      <div class="field" style="flex:1">
        <label>상태</label>
        <select name="status">
          {% for val, lbl in status_choices %}
            <option value="{{ val }}" {% if menu and menu.status == val %}selected{% endif %}>{{ lbl }}</option>
          {% endfor %}
        </select>
      </div>
    </div>
    <div class="field">
      <label>설명</label>
      <textarea name="description" rows="3">{{ menu.description|default:'' }}</textarea>
    </div>
    <div class="field">
      <label>이미지 {% if menu.image %}(현재: {{ menu.image.name }}){% endif %}</label>
      <input type="file" name="image" accept="image/*">
    </div>
    <button class="btn btn-primary" type="submit">저장</button>
  </form>
</div>
{% endblock %}
